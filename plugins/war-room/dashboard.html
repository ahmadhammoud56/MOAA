<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui.css">
<style>
html, body { height: 100%; overflow: hidden; }
.page { display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr); }
.top { padding: 12px 20px; min-height: 60px; gap: 14px; }
.top h1 { font-size: 17px; }
.top .sub .mono { font-size: 12px; color: var(--dim); }
.top .sub b { font-weight: 500; color: var(--text); }
#integrate, #resume { display: none; } #integrate.show, #resume.show { display: inline-flex; }
#demo { display: none; } #demo.show { display: inline-flex; }
.cmdk { min-width: 180px; }

/* ---------- needs attention ---------- */
.attn { display: none; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); overflow-x: auto; align-items: stretch; }
.attn.show { display: flex; }
.attn .lbl { font: 600 12.5px var(--sans); color: var(--dim); align-self: center; white-space: nowrap; padding-right: 2px; }
.attn .it { display: flex; align-items: center; gap: 12px; flex: 0 1 480px; min-width: 300px; padding: 8px 10px 8px 12px; border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--r); background: var(--panel); animation: rise .25s ease-out; }
.attn .it.bad { border-left-color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.attn .it.ok { border-left-color: var(--ok); }
.attn .it.stripes { background: repeating-linear-gradient(-45deg, var(--danger-bg) 0 12px, var(--danger-bg2) 12px 24px); }
.attn .it .tx { min-width: 0; }
.attn .it .t { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attn .it .d { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attn .it .acts { margin-left: auto; display: flex; gap: 6px; flex: none; }
.attn .it .acts button { padding: 4px 9px; font-size: 12px; }

/* ---------- KPI strip ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { padding: 11px 20px 12px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .v { font: 500 21px/1.25 var(--mono); display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.kpi .v small { font: 400 12.5px var(--sans); color: var(--faint); }
.kpi .l { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .bar { margin-top: 8px; overflow: visible; }
.kpi .bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--faint); border-radius: 1px; }
.kpi .bar .tick.stop { background: var(--danger); }
.kpi.hot .v { color: var(--danger); }
.kpi .fams { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }

/* ---------- body ---------- */
.body { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; min-height: 0; }
.body > section { min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.body > section:last-child { border-right: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; height: 44px; flex: none; font: 600 13px var(--sans); }
.ph > span { font-weight: 400; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { overflow: auto; min-height: 0; min-width: 0; flex: 1; }
.body > section, .right > div { min-width: 0; }
#workers { padding: 0 12px 12px; }

/* team cards */
.wk { --c: var(--claude); border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); padding: 11px 12px 10px; margin-bottom: 8px;
  cursor: pointer; position: relative; transition: border-color .25s, background .25s; }
.wk:hover { border-color: var(--line-strong); background: var(--raise); }
.wk.busy { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.wk:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.wk.boot { animation: reveal .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.wk .h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wk .who { min-width: 0; }
.wk .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.wk .rl { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk .st { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; align-self: flex-start; padding-top: 2px; }
.wk.busy .st { color: var(--accent); }
.wk .now { margin-top: 8px; font-size: 12.5px; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wk .now b { color: var(--text); font-weight: 500; }
.wk .meta { display: flex; gap: 2px 10px; flex-wrap: wrap; font: 11px var(--mono); color: var(--faint); margin-top: 6px; }
.wk .meta .inbox { color: var(--accent); }
.wk .ctx { height: 2px; background: var(--sunk); margin-top: 8px; position: relative; border-radius: 1px; overflow: hidden; }
.wk .ctx i { position: absolute; inset: 0 auto 0 0; background: var(--c); opacity: .75; transition: width .8s; }
.spark { display: block; width: 100%; height: 18px; margin-top: 6px; }
.spark polyline { fill: none; stroke: var(--c); stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: .8; }
.spark .area { fill: color-mix(in srgb, var(--c) 14%, transparent); stroke: none; }
.typing::after { content: "_"; animation: blink 1s steps(1) infinite; color: var(--accent); margin-left: 2px; }
.bootseq { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 8px; }
.bootseq i { font: normal 500 9.5px var(--mono); color: var(--faint); border-top: 2px solid var(--line-strong); padding-top: 3px; transition: color .25s, border-color .25s; }
.bootseq i.done { color: var(--dim); border-top-color: var(--ok); }
.bootseq i.cur { color: var(--accent); border-top-color: var(--accent); animation: blink .6s steps(2, jump-none) infinite; }

/* center: tabs, stage, timeline */
.center { display: grid !important; grid-template-rows: auto minmax(0, 1fr) 176px; }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); }
.seg button { padding: 4px 11px; font-size: 12.5px; border: 0; background: transparent; color: var(--dim); border-radius: 4px; }
.seg button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.legend { font-size: 12px; color: var(--faint); white-space: nowrap; }
.legend i { font-style: normal; }
.stage { position: relative; min-height: 0; overflow: hidden; border-top: 1px solid var(--line); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#pane { position: absolute; inset: 0; overflow: auto; display: none; container-type: inline-size; }
.center.html-view #pane { display: block; } .center.html-view #view { display: none; }
.tl { border-top: 1px solid var(--line); overflow: auto; min-height: 0; }
.tl .ph { height: 36px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
svg { display: block; width: 100%; }

/* board: the kanban */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px 16px 16px; align-items: start; min-height: 100%; }
.lane { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 10px 4px; min-width: 0; }
.lane .lh { display: flex; justify-content: space-between; align-items: center; font: 600 12.5px var(--sans); color: var(--dim); margin: 0 2px 10px; }
.lane .lh b { font: 500 11.5px var(--mono); color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.lane .none { color: var(--faint); font-size: 12px; padding: 4px 2px 12px; }
.tc { --c: var(--line-strong); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: var(--r); padding: 9px 10px 9px; margin-bottom: 8px; cursor: pointer; }
.tc:hover { border-color: var(--line-strong); border-left-color: var(--c); background: var(--raise); }
.tc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tc .id { font: 11px var(--mono); color: var(--faint); display: flex; justify-content: space-between; gap: 6px; }
.tc .t { font-weight: 500; font-size: 13px; line-height: 1.4; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.tc .m { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 12px; color: var(--dim); min-width: 0; }
.tc .m .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tc .m .r { margin-left: auto; font: 500 11.5px var(--mono); white-space: nowrap; flex: none; }
.tc .m .r.ok { color: var(--ok); } .tc .m .r.bad { color: var(--danger); } .tc .m .r.warn { color: var(--accent); }
.tc.blocked { border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); background: var(--danger-bg); }
.tc.merged { opacity: .78; }
.tc.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent); } to { box-shadow: 0 0 0 2px transparent; } }

/* flow + topology (svg) */
.st-box { fill: var(--sunk); stroke: var(--line); rx: 8; }
.st-box.hot { stroke: var(--line-strong); }
.st-name { fill: var(--dim); font: 600 12px var(--sans); }
.st-count { fill: var(--text); font: 500 18px var(--mono); }
.st-sub { fill: var(--faint); font: 11px var(--sans); }
.belt { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
.belt.run { animation: belt 1.1s linear infinite; }
@keyframes belt { to { stroke-dashoffset: -12; } }
.belt-arrow { fill: var(--line-strong); }
.tok { transition: transform .95s cubic-bezier(.65,0,.2,1), opacity .5s; }
.tok rect.body { fill: var(--panel); stroke: var(--line-strong); rx: 4; }
.tok text { fill: var(--text); font: 11.5px var(--sans); }
.tok text.sub { fill: var(--faint); font: 10px var(--mono); }
.tok.enter { opacity: 0; }
.trail { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; animation: trail 1.6s ease-out forwards; }
@keyframes trail { from { opacity: .95; } to { opacity: 0; } }
.chipw rect { fill: var(--raise); stroke: var(--line); }
.chipw text { fill: var(--dim); font: 10.5px var(--sans); }
.chipw.boot { animation: chipin .6s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes chipin { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
.node rect.box { fill: var(--panel); stroke: var(--line-strong); transition: stroke .3s; }
.node.busy rect.box { stroke: var(--accent); stroke-dasharray: 6 4; animation: march 1s linear infinite; }
.node.boot rect.box { stroke: var(--info); stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw 1.2s ease-out forwards; }
.node.boot text { opacity: 0; animation: fadein .4s .8s forwards; }
.deploy { stroke: var(--info); fill: none; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s ease-out forwards, trail 2.6s 1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes march { to { stroke-dashoffset: -20; } }
.node text { fill: var(--text); font: 600 12.5px var(--sans); }
.node text.sub { fill: var(--faint); font: 400 11px var(--sans); }
.edge { stroke: var(--line-strong); fill: none; transition: stroke .4s; }
.edge.hot { stroke: var(--accent); stroke-width: 1.2; }
.edgelabel { fill: var(--faint); font: 10.5px var(--mono); }
.packet { fill: var(--accent); }

/* timeline */
#lanes text { fill: var(--dim); font: 11.5px var(--sans); }
#lanes line.lane { stroke: var(--line); }
#lanes line.now { stroke: var(--accent); stroke-dasharray: 2 3; }
#lanes text.scale { fill: var(--faint); font: 10.5px var(--mono); }
#lanes rect.seg { opacity: .5; }

/* right column: review gates, merge queue, activity */
.right { display: grid !important; grid-template-rows: minmax(150px, 1.15fr) auto minmax(130px, 1fr); }
.right > div { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line); }
.right > div:last-child { border-bottom: 0; }
.right > div.mq { max-height: 38vh; }
#gates { padding: 0 12px 6px; }
.gate { border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); padding: 9px 11px 9px; margin-bottom: 8px; cursor: pointer; }
.gate:hover { border-color: var(--line-strong); background: var(--raise); }
.gate.new { animation: slidein .35s ease-out both; }
.gate .r1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.gate .what { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gate .what span { font: 11.5px var(--mono); color: var(--faint); margin-right: 5px; }
.gate .vd { margin-left: auto; font: 600 11px var(--mono); white-space: nowrap; flex: none; }
.gate .vd.pass { color: var(--ok); } .gate .vd.fail { color: var(--danger); } .gate .vd.wait { color: var(--info); animation: blink 1.4s steps(2, jump-none) infinite; }
.gate .gbar { position: relative; height: 4px; background: var(--sunk); border-radius: 2px; margin-top: 8px; }
.gate .gbar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; transition: width 1s cubic-bezier(.2,.7,.2,1); }
.gate .gbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; text-decoration: none; }
.gate .whoes { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12px; color: var(--dim); min-width: 0; flex-wrap: wrap; }
.gate .notes { font-size: 12.5px; color: var(--dim); margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.merge { padding: 0 16px 12px; font-size: 12.5px; color: var(--dim); display: grid; gap: 7px; overflow: auto; }
.merge .branch { color: var(--text); font-family: var(--mono); font-size: 12px; }
.chain { display: flex; gap: 3px; flex-wrap: wrap; }
.chain i { width: 11px; height: 11px; background: var(--ok); display: inline-block; border-radius: 2px; }
.chain i.new { animation: chipin .4s both; }
.chain i.queued { background: transparent; border: 1px solid var(--accent); animation: blink 1.4s steps(2, jump-none) infinite; }
.chain i.conflict { background: var(--danger); }
.report { margin: 0; padding: 10px 12px; font: 11.5px/1.55 var(--mono); color: var(--dim); white-space: pre-wrap; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); }
.log .ev { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); line-height: 1.45; }
.log .ev .tm { font: 11.5px/1.65 var(--mono); color: var(--faint); }
.log .ev b { font-weight: 600; color: var(--c, var(--text)); }
.log .ev .x { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.log .ev.bad .k { color: var(--danger); } .log .ev.good .k { color: var(--ok); }
.log .ev.new { animation: slidein .35s ease-out; }
.pad-empty { padding: 4px 16px 14px; color: var(--faint); font-size: 12.5px; }

/* ---------- TREE: the run as a terminal-style agent tree (stays dark in the light theme) ---------- */
.tree { --bg: #0b0d10; --panel: #121519; --raise: #171b20; --sunk: #0e1013; --line: #232830; --line-strong: #343b45;
  --text: #d7dce2; --dim: #8a939e; --faint: #5c6570; background: #0b0d10; min-height: 100%; }
.tree { --tg: #57d68d; --to: #f0a14a; --tw: #c9ced6; --tv: #a98bf0; --ta: #e8b84a; --tb: #6cb2f0; --tr: #ef6a5a; --td: #6b7480;
  font: 11.5px/1.5 var(--mono); color: #c3c9d1; padding: 12px 14px 14px; min-width: 0; }
.tree .t-g { color: var(--tg); } .tree .t-o { color: var(--to); } .tree .t-w { color: var(--tw); } .tree .t-v { color: var(--tv); }
.tree .t-a { color: var(--ta); } .tree .t-b { color: var(--tb); } .tree .t-r { color: var(--tr); } .tree .t-d { color: var(--td); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; margin-bottom: 12px; font-size: 10.5px; letter-spacing: .06em; }
.step { padding: 3px 9px; border: 1px solid transparent; color: var(--td); white-space: nowrap; }
.step.ok { color: var(--tg); } .step.on { color: #e9edf2; border-color: var(--tw); background: #171b20; }
.step.on::before { content: "▸ "; color: var(--ta); }
.steps .sep { color: #343b45; }
.tbody { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 18px; position: relative; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: #4a525d; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0 7; }
.wire.run { animation: wire 1.4s linear infinite; }
@keyframes wire { to { stroke-dashoffset: -14; } }
.tbox { border: 1px dashed var(--td); padding: 8px 10px; background: var(--bg); position: relative; z-index: 1; min-width: 0; }
.tbox .ttl { color: #e9edf2; font-weight: 500; text-align: center; }
.tbox .c { text-align: center; }
.tbox.hot { border-style: solid; }
.rail { border-color: var(--tw); align-self: start; }
.rail .rv { margin-bottom: 8px; } .rail .rv b { font-weight: 500; }
.rail .gl { margin-top: 2px; padding: 3px 5px; border: 1px solid transparent; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rail .gl.hot { border-color: var(--tw); background: #171b20; color: #e9edf2; }
.rail .gl.hot::before { content: "◆ "; color: var(--ta); }
.rail .gs { padding: 0 5px 3px; color: var(--td); font-size: 10.5px; }
.rail .foot { margin-top: 10px; color: var(--td); font-size: 10.5px; }
.tmain { display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0; }
.tmain > .tbox { width: min(100%, 420px); }
.tmain > .tbox.wide { width: min(100%, 560px); }
.krow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.blk { display: inline-flex; gap: 2px; vertical-align: -1px; }
.blk i { width: 7px; height: 9px; background: #262c34; }
.blk i.on { background: currentColor; }
.lanes2 { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; width: 100%; }
.lanes2 .tbox { width: 168px; cursor: pointer; }
.lanes2 .tbox:hover { background: #12161a; }
.lanes2 .tbox:focus-visible { outline: 2px solid var(--ta); outline-offset: 2px; }
.wave { letter-spacing: 0; color: var(--tg); }
.tag-line { text-align: center; color: #e9edf2; }
.slog { margin-top: 14px; border-top: 1px solid var(--line); }
.slog .h { color: var(--td); padding: 6px 0 4px; font-size: 10.5px; letter-spacing: .08em; }
.slog .r { display: grid; grid-template-columns: 14px 86px 92px minmax(0, 1fr) auto; gap: 8px; padding: 1px 0; }
.slog .r span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.slog .r.new { animation: slidein .35s ease-out; }
.prompt { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.prompt .cur { display: inline-block; width: 7px; height: 12px; background: var(--tw); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
.prompt .sl { margin-top: 6px; color: var(--td); display: flex; flex-wrap: wrap; gap: 4px 16px; }
@container (max-width: 640px) { .tbody { grid-template-columns: 1fr; } .steps .sep { display: none; } .step { padding: 3px 6px; } .slog .r { grid-template-columns: 12px 58px 70px minmax(0, 1fr); } .slog .r span:last-child { display: none; } .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- COST ---------- */
.cost { padding: 14px 16px 18px; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiles div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 12px; font-size: 12.5px; color: var(--dim); min-width: 0; }
.tiles b { display: block; font: 500 18px var(--mono); color: var(--text); margin-top: 2px; }
.tiles small { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { position: relative; }
.chart .ct { font: 600 13px var(--sans); color: var(--text); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
.chart .ct span { color: var(--faint); font-weight: 400; font-size: 12px; }
.chart svg { overflow: visible; }
.chart .grid { stroke: var(--line); }
.chart .ax { fill: var(--faint); font: 10.5px var(--mono); }
.chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .rule { stroke-width: 1; stroke-dasharray: 4 3; }
.chart .proj { fill: none; stroke-width: 1.5; stroke-dasharray: 2 4; }

<body>
<div class="app fixed">
<nav class="side" id="side"></nav>
<div class="page">
  <header class="top">
    <div class="ttl"><h1 id="goal">Loading the run…</h1>
      <div class="sub"><span class="mono" id="run"></span> · up <b class="num" id="uptime">--</b> · conductor <b id="cond">--</b><span id="branchname"></span> · <span class="num" id="clock"></span></div></div>
    <span class="tag" id="state-tag">--</span><span class="tag demo" id="demo" title="Simulated run: no Claude sessions, no tokens">Demo</span>
    <button type="button" class="cmdk" onclick="palette.open()"><span>Search or run a command…</span><span class="kbd">Ctrl K</span></button>

      <button id="integrate" class="go" type="button" title="Merge the run's branch into the project's current branch (never pushed)">Integrate</button>
      <button id="resume" class="go" type="button">Resume</button>
      <button id="pause" type="button">Pause</button>
      <button id="shutdown" type="button" title="Finish now: stop workers, record cost, clean sessions and merged worktrees">Finish</button>

    <input type="range" id="r-pos" aria-label="Replay position"><span class="t" id="r-t">--</span><a class="btn sm" href="?">Exit replay</a></div>
  <div class="attn" id="attn" aria-live="polite"></div>
  <div class="kpis" id="kpis">
    <div class="kpi"><div class="v" id="k-tasks">--</div><div class="l">tasks merged</div><div class="bar"><i id="k-tasks-b" style="width:0;background:var(--ok)"></i></div></div>
    <div class="kpi" id="k5"><div class="v"><span id="m5">--</span><small id="m7">weekly --</small></div><div class="l" id="k5-l">5-hour window</div>
      <div class="bar"><i id="f5" style="width:0"></i><span class="tick" id="tp"></span><span class="tick stop" id="ts"></span></div></div>
    <div class="kpi" id="kspend"><div class="v" id="k-spend">--</div><div class="l" id="k-spend-l">spend</div><div class="bar"><i id="k-spend-b" style="width:0;background:var(--info)"></i></div></div>
    <div class="kpi"><div class="v" id="k-work">--</div><div class="l" id="k-work-l">working</div><div class="fams" id="k-fams"></div></div>
    <div class="kpi" id="kneed"><div class="v" id="k-need">--</div><div class="l" id="k-need-l">need you</div></div>
  </div>
  <main class="body">
    <section aria-labelledby="team-h"><div class="ph"><span id="team-h" style="color:var(--text);font-weight:600;font-size:13px">Team</span><span id="wcount"></span></div><div class="scroll"><div id="workers"></div></div></section>
    <section class="center html-view" id="center">
      <div class="ph"><div class="seg" role="tablist" aria-label="Views">
        <button id="tab-board" class="on" type="button" role="tab" aria-selected="true">Board</button><button id="tab-flow" type="button" role="tab" aria-selected="false">Flow</button><button id="tab-tree" type="button" role="tab" aria-selected="false">Tree</button><button id="tab-topo" type="button" role="tab" aria-selected="false">Topology</button><button id="tab-cost" type="button" role="tab" aria-selected="false">Cost</button></div>
        <span><span class="legend" id="legend"></span> <span id="mcount"></span></span></div>
      <div class="stage"><svg id="view" role="group" aria-label="Live workflow of the run"></svg><div id="pane"></div><div class="bootbar" id="bootbar" aria-live="polite"></div></div>
      <div class="tl"><div class="ph">Timeline <span>last 30 min · coloured by model family</span></div><svg id="lanes" role="img" aria-label="Activity timeline per worker"></svg></div>
    </section>
    <section class="right">
      <div><div class="ph">Review gates <span id="tcount"></span></div><div class="scroll"><div id="gates"></div></div></div>
      <div class="mq"><div class="ph">Merge queue <span id="branch"></span></div><div class="merge" id="merge"></div></div>
      <div><div class="ph">Activity</div><div class="scroll log" id="log"></div></div>
    </section>
  </main>
</div>
</div>
<div class="dscrim" id="dscrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-name" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"></div></div>
<script src="/ui.js"></script>
<script>
const TOKEN = "__TOKEN__", RUN = "__RUN__", API = `/api/run/${RUN}`;
const maxOf = (arr, f, d = 0) => arr.reduce((m, x) => Math.max(m, f(x)), d);
const famVar = m => `var(--${family(m)})`;
const clip = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const parkedOf = w => (w.note || "").startsWith("parked"), busyOf = w => w.status === "busy" && !parkedOf(w);
let seenGates = new Set(), seenChips = new Set(), bootShown = new Set(), busy = false, contactLost = "";
const SVGNS = "http://www.w3.org/2000/svg";
let last = null, fetchedAt = 0, serverSkew = 0, lastMsgId = null, lastEventTs = 0, packets = [], edgePaths = {};
let view = "board", knownWorkers = null, booting = {}, tokPos = {}, prevSession = {};
shell("run"); setRunNav(RUN, true);

async function post(action, confirmText, body = {}) {
  if (confirmText && !confirm(confirmText)) return null;
  const r = await fetch(`${API}/${action}`, {method: "POST", headers: {"X-War-Room-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const out = await r.json().catch(() => ({}));
  if (!r.ok && !out.cap) toast(cap(action), out.error || String(r.status), "danger");
  tick(); return out;
}
const act = {
  stop: () => post("stop", "Stop every worker in this run? Conversations are kept and can be resumed."),
  pause: () => post(last?.control?.claims === "paused" ? "unpause" : "pause"),
  async resume() {
    const out = await post("resume", "Resume every worker with its conversation?");
    if (!out || !out.cap) return;  /* stopped at the spend cap: resuming needs a higher cap */
    const v = prompt(`${out.error}.\nNew spend cap in USD (0 = no cap):`);
    if (v != null && v.trim() !== "" && isFinite(+v) && +v >= 0) post("resume", null, {max_cost: +v});
  },
  finish: () => post("finish", "Finish the run now? Workers stop, the cost is recorded, sessions and fully merged worktrees are cleaned up."),
  async integrate() {
    const out = await post("integrate", "Merge the run's branch into the project's current branch? (--no-ff, nothing is pushed)");
    if (out && out.ok) toast("Integrated", `Merged into ${out.target} (${out.head.slice(0, 8)}). Nothing was pushed.`, "ok");
  },
  async decide(id, approve) {
    let notes = "";
    if (approve && !confirm(`Approve #${id}? It is merged like a passed review.`)) return;
    if (!approve) { notes = prompt(`Reject #${id}: what should its author fix?`); if (notes == null) return; }
    const out = await post("decide", null, {task: id, approve, notes});
    if (out?.ok) toast(approve ? "Approved" : "Sent back", `#${id}`, approve ? "ok" : "");
  },
  async alerts() {
    const on = !(last?.ui?.notify);
    if (on && "Notification" in window && Notification.permission === "default") await Notification.requestPermission().catch(() => {});
    try { await api("/api/ui", {notify: on}); if (on) beep(); } catch (e) { fail(e); }
    tick();
  }
};
$("stop").onclick = act.stop; $("pause").onclick = act.pause; $("resume").onclick = act.resume;
$("shutdown").onclick = act.finish; $("integrate").onclick = act.integrate; $("alerts").onclick = act.alerts;
const VIEWS = ["board", "flow", "tree", "topo", "cost"];
for (const v of VIEWS) $(`tab-${v}`).onclick = () => setView(v);
function setView(v) {
  view = v;
  for (const x of VIEWS) { $(`tab-${x}`).classList.toggle("on", x === v); $(`tab-${x}`).setAttribute("aria-selected", x === v); }
  $("center").classList.toggle("html-view", !["flow", "topo"].includes(v));
  $("view").innerHTML = ""; setHTML($("pane"), ""); tokPos = {}; packets = []; cardAt = {};
  if (v === "cost") usageAt = 0;
  history.replaceState(null, "", location.pathname + location.search + (v === "board" ? "" : `#${v}`));
  $("legend").textContent = ""; $("mcount").textContent = "";
  if (last) drawView(last);
}

function tween(el, to, suffix = "%") {
  if (to == null) { el.textContent = "--"; return; }
  const from = parseFloat(el.dataset.v ?? to), t0 = performance.now(), d = REDUCED ? 0 : 700;
  el.dataset.v = to;
  const step = now => { const k = d ? Math.min(1, (now - t0) / d) : 1, v = from + (to - from) * (1 - Math.pow(1 - k, 3));
    el.textContent = `${Math.round(v)}${suffix}`; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- header and KPI strip ---------- */
function header(st) {
  const c = st.control, finished = !!c.finished, stopped = c.run === "stop" && !finished;
  $("run").textContent = st.run; $("goal").textContent = st.goal || st.run; $("goal").title = st.goal || "";
  const ig = st.integration || {};
  $("branchname").innerHTML = ig.branch ? ` · branch <span class="mono">${esc(ig.branch)}</span>` : "";
  const [label, cls] = REPLAY ? ["Replay", "info"] : finished ? ["Finished", "ok"] : c.finishing ? ["Finishing", "ok"] : stopped ? ["Stopped", "bad"]
    : c.claims === "paused" ? ["Paused", "warn"] : ["Live", "live"];
  $("state-tag").className = `tag ${cls}`; $("state-tag").innerHTML = `${label === "Live" ? '<i class="pulse"></i>' : ""}${label}`;
  $("pause").textContent = c.claims === "paused" ? "Unpause" : "Pause";
  $("integrate").classList.toggle("show", finished && !st.demo && !st.integrated && !!ig.branch);
  $("demo").classList.toggle("show", !!st.demo);
  const al = !!(st.ui || {}).notify;
  $("alerts").classList.toggle("on", al); $("alerts").setAttribute("aria-pressed", al); $("alerts").textContent = al ? "Alerts on" : "Alerts off";
  $("resume").classList.toggle("show", stopped && !c.resume_at);
  for (const id of ["pause", "stop", "shutdown"]) $(id).style.display = finished ? "none" : "";
  setRunNav(st.run, label === "Live" || label === "Paused");
}
function kpis(st) {
  const b = st.budget || {}, f = st.meter.five, w = st.meter.week, work = st.tasks.filter(t => t.kind !== "review");
  const merged = work.filter(t => ["merged", "done"].includes(t.status)).length;
  $("k-tasks").innerHTML = `${merged}<small>/ ${work.length}</small>`;
  $("k-tasks-b").style.width = `${work.length ? merged / work.length * 100 : 0}%`;
  tween($("m5"), f); $("m7").textContent = `weekly ${w == null ? "--" : Math.round(w) + "%"}`;
  const pa = b.pause_at || 85, so = b.stop_at || 95;
  $("f5").style.width = `${f || 0}%`; $("f5").style.background = f >= so ? "var(--danger)" : f >= pa ? "var(--accent)" : "var(--dim)";
  $("tp").style.left = `${pa}%`; $("ts").style.left = `${so}%`;
  $("k5-l").textContent = `5-hour window · pause ${pa} · stop ${so}`; $("k5").classList.toggle("hot", f >= so);
  const spend = st.workers.reduce((a, x) => a + (x.cost_usd || 0), 0), capUsd = +b.max_cost_usd || 0;
  $("k-spend").textContent = money(spend);
  $("k-spend-l").textContent = capUsd ? `spend · cap ${money(capUsd)}` : "spend · no cap";
  $("k-spend-b").style.width = `${capUsd ? Math.min(100, spend / capUsd * 100) : 0}%`;
  $("k-spend-b").style.background = capUsd && spend / capUsd >= .8 ? "var(--danger)" : "var(--info)";
  $("kspend").classList.toggle("hot", !!capUsd && spend >= capUsd);
  const on = st.workers.filter(busyOf), allies = on.filter(x => isAlly(x.model));
  $("k-work").innerHTML = `${on.length}<small>/ ${st.workers.length}</small>`;
  $("k-work-l").textContent = `working · ${on.length - allies.length} Claude · ${allies.length} ${allies.length === 1 ? "ally" : "allies"}`;
  const fams = {}; for (const x of st.workers) fams[family(x.model)] = (fams[family(x.model)] || 0) + 1;
  setHTML($("k-fams"), Object.entries(fams).map(([k, n]) => `<span class="fam f-${k}">${esc(FAMILIES[k])} ${n}</span>`).join(""));
  const gates = st.tasks.filter(t => t.status === "blocked").length;
  $("k-need").textContent = gates; $("kneed").classList.toggle("hot", gates > 0);
  $("k-need-l").textContent = gates ? `human gate${gates > 1 ? "s" : ""} waiting for you` : "nothing waiting for you";
}

/* ---------- needs attention: run state, human gates, failed reviews, limits ---------- */
function attention(st) {
  const c = st.control, b = st.budget || {}, out = [], byId = Object.fromEntries(st.tasks.map(t => [t.id, t]));
  const item = (tone, title, detail, acts = "") => out.push(`<div class="it ${tone}"><div class="tx"><div class="t">${title}</div>${detail ? `<div class="d">${detail}</div>` : ""}</div>${acts ? `<div class="acts">${acts}</div>` : ""}</div>`);
  if (contactLost) item("bad stripes", "Lost contact with the hub", esc(contactLost));
  if (st.integrated) item("ok", `Integrated into ${esc(st.integrated.target)}`, `head ${esc(st.integrated.head.slice(0, 8))} · nothing pushed`);
  else if (c.finished) item("ok", "Run complete", `Sessions and merged worktrees cleaned up${st.demo ? "" : " · review the report, then integrate"}`, st.demo || !(st.integration || {}).branch || REPLAY ? "" : `<button class="go" type="button" data-act="integrate">Integrate</button>`);
  else if (c.complete_since) item("ok", "All work merged", `Finishing in ${Math.max(0, Math.round(90 - (st.now - +c.complete_since)))} s unless new work arrives`);
  else if (c.run === "stop") item("bad stripes", c.resume_at ? "Stopped by the usage guard" : "Run stopped", c.resume_at ? `Auto-resume at ${hm(+c.resume_at)}` : "Conversations kept · resume to continue",
    c.resume_at || REPLAY ? "" : `<button class="go" type="button" data-act="resume">Resume</button>`);

      `<i class="${i < s ? "done" : i === s ? "cur" : ""}" title="${x === "PLUGINS" ? `${(w.plugins || []).length} plugins` : ""}">${x}</i>`).join("")}</div></div>`).join("")}`);
}

/* ---------- alerts: toast always, desktop notification and sound when switched on ---------- */
let prevAlert = null;
function alerts(st) {
  const blocked = st.tasks.filter(t => t.status === "blocked"), cur = {blocked: new Set(blocked.map(t => t.id)), finished: !!st.control.finished, stop: st.control.run === "stop"};
  const out = [];
  if (prevAlert) {
    for (const t of blocked) if (!prevAlert.blocked.has(t.id)) out.push(["Human gate", `#${t.id} ${t.title} needs your decision`, "danger"]);
    if (cur.finished && !prevAlert.finished) out.push(["Run finished", `${st.run}: review the report${st.demo ? "" : ", then integrate"}`, "ok"]);
    else if (cur.stop && !prevAlert.stop && !cur.finished && !st.control.finishing) out.push(["Run stopped", st.control.resume_at ? `usage guard: auto-resume at ${hm(+st.control.resume_at)}` : "every worker stopped; conversations kept", "danger"]);
  }
  prevAlert = cur;
  for (const [title, body, kind] of out) alertUser(title, body, kind, st.ui, `${st.run}:${title}:${body}`);
}

/* ---------- timeline: per worker, busy stretches and events in the worker's family colour ---------- */
const BAD = new Set(["stop", "guard", "merge-conflict", "watchdog", "conductor-error"]);
let lanesDrawn = 0;
function lanes(nowSec) {
  if (!last || performance.now() - lanesDrawn < 250) return;
  lanesDrawn = performance.now();
  const st = last, svg = $("lanes"), W = svg.clientWidth || 600, by = Object.fromEntries(st.workers.map(w => [w.name, w]));
  const names = ["orchestrator", "conductor", ...st.workers.map(w => w.name)];
  const avail = (svg.parentElement.clientHeight || 176) - 36 - 30;
  const span = 1800, x0 = 112, lh = Math.max(14, Math.min(20, avail / names.length)), x1 = W - 14, X = ts => x0 + (x1 - x0) * (1 - (nowSec - ts) / span);
  const col = n => by[n] ? famVar(by[n].model) : "var(--dim)";
  let out = "";
  for (let m = 0; m <= 30; m += 5) { const x = x0 + (x1 - x0) * (1 - m * 60 / span); out += `<text class="scale" x="${x - 8}" y="10">${m ? `-${m}m` : "now"}</text>`; }
  names.forEach((n, i) => { const y = 26 + i * lh;
    out += `<rect x="10" y="${y - 4}" width="8" height="8" rx="2" style="fill:${col(n)}"/><text x="24" y="${y + 4}">${esc(clip(n, 12))}</text><line class="lane" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>`; });
  const lane = Object.fromEntries(names.map((n, i) => [n, i])), open = {};
  for (const e of st.events) {  /* busy stretches: from a claim to the work handed on */
    const i = lane[e.agent]; if (i === undefined || !by[e.agent]) continue;
    if (e.kind === "claim") open[e.agent] = e.ts;
    else if (["done", "review", "verdict", "stop"].includes(e.kind) && open[e.agent] != null) {
      const a = Math.max(open[e.agent], nowSec - span); if (e.ts > a) out += `<rect class="seg" x="${X(a)}" y="${26 + i * lh - 5}" width="${Math.max(2, X(e.ts) - X(a))}" height="10" rx="2" style="fill:${col(e.agent)}"/>`;
      delete open[e.agent];
    }
  }
  for (const [n, t0] of Object.entries(open)) if (by[n] && busyOf(by[n])) { const a = Math.max(t0, nowSec - span);
    out += `<rect class="seg" x="${X(a)}" y="${26 + lane[n] * lh - 5}" width="${Math.max(2, x1 - X(a))}" height="10" rx="2" style="fill:${col(n)}"/>`; }
  for (const e of st.events) {
    if (nowSec - e.ts > span) continue;
    const i = lane[e.agent === "hub" ? "orchestrator" : e.agent]; if (i === undefined) continue;
    const x = X(e.ts), y = 26 + i * lh, tip = `<title>${esc(hhmm(e.ts) + " " + e.kind + " " + e.detail)}</title>`;
    if (e.kind === "verdict" || e.kind === "review") {
      const c = e.kind === "review" ? "var(--info)" : /approved/.test(e.detail) ? "var(--ok)" : "var(--danger)";
      out += `<rect x="${x - 3.5}" y="${y - 3.5}" width="7" height="7" transform="rotate(45 ${x} ${y})" style="fill:${c};stroke:var(--bg);stroke-width:1">${tip}</rect>`;
    } else if (e.kind !== "tool") out += `<rect x="${x - 1.5}" y="${y - 6}" width="3" height="12" rx="1" style="fill:${BAD.has(e.kind) ? "var(--danger)" : e.kind === "merge" ? "var(--ok)" : col(e.agent)}">${tip}</rect>`;
  }
  out += `<line class="now" x1="${x1}" x2="${x1}" y1="16" y2="${30 + names.length * lh}"/>`;
  svg.setAttribute("height", 36 + names.length * lh); svg.innerHTML = out;
}

/* ---------- review gates: every verdict with its score against the pass line ---------- */
let gateBars = {};
function gatesPanel(st) {
  const pass = (st.budget || {}).gate_score || 85, work = Object.fromEntries(st.tasks.map(t => [t.id, t])), by = Object.fromEntries(st.workers.map(w => [w.name, w]));
  const reviews = st.tasks.filter(t => t.kind === "review").sort((a, b) => b.id - a.id);
  const done = reviews.filter(r => r.status === "done"), passed = done.filter(r => (r.result || "").startsWith("pass") && (r.score == null || r.score >= pass));
  $("tcount").textContent = reviews.length ? `${passed.length} passed · ${done.length - passed.length} failed · pass ${pass}` : `pass line ${pass}`;
  const person = n => { const w = by[n]; return n ? `${w ? avatar(n, w.model, "sm") : ""}<span>${esc(n)}${w && isAlly(w.model) ? ` (${esc(modelName(w.model))})` : ""}</span>` : "<span>—</span>"; };
  setHTML($("gates"), reviews.map(r => {
    const parent = work[r.parent] || {}, open = r.status !== "done";
    const ok = !open && (r.result || "").startsWith("pass") && (r.score == null || r.score >= pass);
    const notes = (r.result || "").replace(/^(pass|fail) score=\S+\s*/, "");
    const score = r.score == null ? null : Math.round(r.score), arb = r.title.startsWith("Arbitrate");
    const isNew = !seenGates.has(r.id + r.status); seenGates.add(r.id + r.status);
    return `<div class="gate ${isNew ? "new" : ""}" data-task="${r.parent}" role="button" tabindex="0"><div class="r1"><div class="what"><span>#${r.parent}</span>${esc(parent.title || r.title)}</div>
      <span class="vd ${open ? "wait" : ok ? "pass" : "fail"}">${open ? (r.status === "claimed" ? "Reviewing" : "Queued") : `${ok ? "Pass" : "Fail"} ${score ?? ""}`}</span></div>
      <div class="gbar"><i data-k="${r.id}" data-w="${score ?? 0}" style="width:${gateBars[r.id] ? score : 0}%;background:${ok ? "var(--ok)" : "var(--danger)"}"></i><u style="left:${pass}%"></u></div>
      <div class="whoes">${arb ? "⚖ " : ""}${person(r.owner || r.assignee)}<span class="faint">→</span>${person(parent.author)}</div>
      ${notes && !open ? `<div class="notes">${esc(notes)}</div>` : ""}</div>`;
  }).join("") || `<div class="pad-empty" style="padding:4px 4px 12px">No reviews yet. Finished work goes to a reviewer on a different model before it counts.</div>`);
  requestAnimationFrame(() => document.querySelectorAll(".gate .gbar i").forEach(i => { i.style.width = `${i.dataset.w}%`; gateBars[i.dataset.k] = 1; }));
}

function merges(st) {
  const ig = st.integration || {}, ms = st.merges || [];
  $("branch").textContent = st.report ? "report" : ig.branch ? `${ms.filter(m => m.status === "merged").length} merged` : "";
  if (st.report) { setHTML($("merge"), `<pre class="report">${esc(st.report)}</pre>`); return; }
  const merged = ms.filter(m => m.status === "merged");
  setHTML($("merge"), ig.branch ? `
    <div>Into <span class="branch">${esc(ig.branch)}</span> · base <span class="mono">${esc((ig.base || "").slice(0, 8))}</span></div>
    <div class="chain">${ms.map(m => { const isNew = !seenChips.has(m.id + m.status); seenChips.add(m.id + m.status);
      return `<i class="${m.status === "merged" ? "" : esc(m.status)} ${isNew ? "new" : ""}" title="#${+m.task_id} ${esc((m.commit_ref || "").slice(0, 8))} ${esc(m.status)}"></i>`; }).join("") || "<span>Nothing merged yet</span>"}</div>
    <div>${merged.length} merged · ${ms.filter(m => m.status === "queued").length} queued · ${ms.filter(m => m.status === "conflict").length} conflicts${merged.length ? ` · head <span class="mono">${esc((merged[merged.length - 1].detail || "").slice(0, 8))}</span>` : ""}</div>`
    : `<div>Review gates only (no git repository).</div>`);
}

const SAY = {claim: "claimed", done: "finished", review: "handed in for review", verdict: "reviewed", merge: "merged", "merge-conflict": "hit a merge conflict on",
  message: "messaged", checkpoint: "checkpointed", launch: "started", resume: "resumed", stop: "stopped", guard: "guard:", finish: "finished the run", task: "posted",
  "auto-wake": "woke", watchdog: "watchdog:", decision: "decided", integrate: "integrated", pause: "paused claims", unpause: "reopened claims"};
function feed(st) {
  const by = Object.fromEntries(st.workers.map(w => [w.name, w]));
  const rows = st.events.filter(e => e.kind !== "tool").slice(-70).reverse();
  setHTML($("log"), rows.map(e => { const tone = BAD.has(e.kind) || (e.kind === "verdict" && !/approved/.test(e.detail)) ? "bad" : ["merge", "finish", "integrate"].includes(e.kind) || (e.kind === "verdict" && /approved/.test(e.detail)) ? "good" : "";
    return `<div class="ev ${tone} ${lastEventTs && e.ts > lastEventTs ? "new" : ""}" style="--c:${by[e.agent] ? famVar(by[e.agent].model) : "var(--text)"}"><span class="tm">${hm(e.ts)}</span>
      <span class="x"><b>${esc(e.agent)}</b> <span class="k">${esc(SAY[e.kind] || e.kind)}</span> ${esc(e.detail)}</span></div>`; }).join("") || `<div class="pad-empty">Nothing yet.</div>`);
  lastEventTs = maxOf(st.events, e => e.ts, lastEventTs);
}

function clocks() {
  const now = REPLAY && R ? rt : Date.now() / 1000 - serverSkew;
  $("clock").textContent = REPLAY && R ? hhmm(rt) : hm(Date.now() / 1000);
  if (!last) return;
  const el = REPLAY ? 0 : (Date.now() - fetchedAt) / 1000, c = last.control, fin = !!c.finished;
  $("uptime").textContent = c.started ? dur((fin ? +c.finished : now) - +c.started) : "--";
  const ca = last.conductor && last.conductor.age < 1e8 ? last.conductor.age + el : null;
  $("cond").textContent = REPLAY ? "replay" : fin ? "finished" : ca == null ? "offline" : ca < 45 ? "live" : `stale ${dur(ca)}`;
  $("cond").style.color = fin || REPLAY ? "var(--dim)" : ca == null || ca >= 45 ? "var(--danger)" : "var(--ok)";
  document.querySelectorAll(".hb").forEach(h => { const a = h.dataset.age; h.textContent = a === "" ? "hb --" : `hb ${dur(+a + el)}`; });
}

function render(st) {
  detectBoots(st); trackPackets(st);
  header(st); kpis(st); attention(st); workers(st); drawView(st); gatesPanel(st); merges(st); feed(st); clocks(); bootbar(st);
  if (drawer?.kind === "task") renderTask();
}
async function tick() {
  if (busy || REPLAY) return;
  busy = true;
  try {
    const r = await fetch(`${API}/state`);
    if (!r.ok) throw new Error(`hub answered ${r.status}`);
    const st = await r.json();
    last = st; fetchedAt = Date.now(); serverSkew = Date.now() / 1000 - st.now; contactLost = "";
    render(st); alerts(st);
  } catch (e) { contactLost = e.message; if (last) attention(last); else { $("attn").innerHTML = `<div class="it bad stripes"><div class="tx"><div class="t">Lost contact with the hub</div><div class="d">${esc(e.message)}</div></div></div>`; $("attn").classList.add("show"); } }
  finally { busy = false; }
}
let bootTick = 0;
function frame(t) {
  drawPackets(t); lanes(REPLAY && R ? rt : Date.now() / 1000 - serverSkew);
  if (last && Object.keys(booting).length && t - bootTick > 180) { bootTick = t; workers(last); bootbar(last); if (view === "tree") drawTree(last); }
  requestAnimationFrame(frame);
}

/* ---------- command palette entries for the run ---------- */
palette.add(() => {
  if (!last) return [];
  const c = last.control, fin = !!c.finished, out = VIEWS.map(v => ({label: `View: ${$(`tab-${v}`).textContent}`, group: "View", run: () => setView(v)}));
  if (!REPLAY) {
    if (!fin) out.push({label: c.claims === "paused" ? "Unpause claims" : "Pause claims", group: "Run", run: act.pause},
      {label: "Finish the run now", group: "Run", run: act.finish}, {label: "Stop all workers", group: "Run", run: act.stop});
    if (c.run === "stop" && !fin && !c.resume_at) out.push({label: "Resume every worker", group: "Run", run: act.resume});
    if ($("integrate").classList.contains("show")) out.push({label: "Integrate into the project branch", group: "Run", run: act.integrate});
    out.push({label: last.ui?.notify ? "Turn alerts off" : "Turn alerts on", group: "Run", run: act.alerts});
    if (fin || c.run === "stop") out.push({label: "Replay this run", group: "Run", run: () => location.href = `${location.pathname}?replay=1`});
  } else out.push({label: "Exit replay", group: "Run", run: () => location.href = location.pathname});
  for (const w of last.workers) out.push({label: `Worker: ${w.name}`, hint: `${w.role} · ${modelName(w.model)}`, group: "Team", run: () => openDrawer("worker", w.name)});
  for (const t of last.tasks.filter(t => t.kind !== "review")) out.push({label: `Task #${t.id}: ${t.title}`, hint: STATUS[t.status] || t.status, group: "Board", run: () => openDrawer("task", t.id)});
  return out;
});

/* ---------- REPLAY: rebuild the run at any moment from its logs and feed the same panels ---------- */
const REPLAY = new URLSearchParams(location.search).has("replay");
let R = null, rt = 0, rt0 = 0, rt1 = 0, rplay = false, rspeed = 8, rcost = 0;
function snapshot(R, t) {
  const final = Object.fromEntries(R.tasks.map(x => [x.id, x])), tasks = {}, merges = [];
  const control = {started: R.control.started, run: null, claims: null, resume_at: null, finished: null, finishing: null, complete_since: null};
  const base = id => ({id, title: (final[id] || {}).title || `#${id}`, kind: (final[id] || {}).kind || "work", parent: (final[id] || {}).parent ?? null,
    status: "open", owner: null, assignee: (final[id] || {}).assignee ?? null, author: null, commit_ref: null, score: null, fails: 0, result: null});
  const events = R.all_events.filter(e => e.ts <= t);
  let mid = 0;
  for (const e of events) {
    const d = e.detail || "", m1 = /#(\d+)/.exec(d), id = m1 ? +m1[1] : null;
    if (e.kind === "task" && id) tasks[id] = base(id);
    else if (e.kind === "claim" && tasks[id]) Object.assign(tasks[id], {status: "claimed", owner: e.agent});
    else if (e.kind === "review") {
      const m = /#(\d+) by (\S+) -> review #(\d+) for (\S+)/.exec(d); if (!m) continue;
      const p = +m[1], r = +m[3];
      if (tasks[p]) Object.assign(tasks[p], {status: "review", author: m[2], owner: m[2], commit_ref: (final[p] || {}).commit_ref ?? null});
      tasks[r] = {...base(r), kind: "review", parent: p, assignee: m[4]};
    } else if (e.kind === "verdict") {
      const m = /#(\d+) (\w+) \(([\s\S]*)\)$/.exec(d); if (!m || !tasks[+m[1]]) continue;  /* notes may span lines */
      const p = tasks[+m[1]], sc = /score=([\d.]+)/.exec(m[3]), score = sc ? +sc[1] : null;
      const rv = Object.values(tasks).filter(x => x.kind === "review" && x.parent === p.id && x.status !== "done").sort((a, z) => z.id - a.id)[0];
      if (rv) Object.assign(rv, {status: "done", owner: rv.owner || e.agent, result: m[3], score});
      if (m[2] === "approved") {
        Object.assign(p, {status: p.commit_ref ? "approved" : "done", score});
        if (p.commit_ref) merges.push({id: ++mid, task_id: p.id, worker: p.author, commit_ref: p.commit_ref, status: "queued", detail: "", ts: e.ts});
      } else if (m[2] === "reopened") Object.assign(p, {status: "open", owner: null, assignee: p.author, fails: p.fails + 1});
      else if (m[2] === "blocked") Object.assign(p, {status: "blocked", fails: p.fails + 1});
      else if (m[2] === "arbitration") {
        p.fails += 1;
        const arb = R.tasks.find(x => x.kind === "review" && x.parent === p.id && x.title.startsWith("Arbitrate") && !tasks[x.id]);
        if (arb) tasks[arb.id] = {...base(arb.id), kind: "review", parent: p.id};
      }
    } else if (e.kind === "done" && tasks[id]) Object.assign(tasks[id], {status: "done", author: e.agent});
    else if (e.kind === "merge" && id && /merged into/.test(d)) {
      if (tasks[id]) tasks[id].status = "merged";
      const q = merges.find(x => x.task_id === id && x.status === "queued"), head = (/\((\w{8})\)$/.exec(d) || [])[1] || "";
      if (q) Object.assign(q, {status: "merged", detail: head, ts: e.ts});
    } else if (e.kind === "merge-conflict" && id) {
      if (tasks[id]) Object.assign(tasks[id], {status: "open", owner: null});
      const q = merges.find(x => x.task_id === id && x.status === "queued"); if (q) q.status = "conflict";
    } else if (e.kind === "decision" && tasks[id]) {
      if (/^#\d+ approved/.test(d)) { tasks[id].status = tasks[id].commit_ref ? "approved" : "done";
        if (tasks[id].commit_ref) merges.push({id: ++mid, task_id: id, worker: tasks[id].author, commit_ref: tasks[id].commit_ref, status: "queued", detail: "", ts: e.ts}); }
      else Object.assign(tasks[id], {status: "open", owner: null});
    } else if (e.kind === "stop") control.run = "stop";
    else if (e.kind === "guard" && /run resumed/.test(d)) { control.run = null; control.claims = null; }
    else if (e.kind === "resume") control.run = null;
    else if (e.kind === "finish") control.finished = control.finished || e.ts;
    else if (e.kind === "pause" || (e.kind === "guard" && /claims paused/.test(d))) control.claims = "paused";
    else if (e.kind === "unpause" || (e.kind === "guard" && /claims reopened/.test(d))) control.claims = null;
  }
  const launched = {}, lastBy = {};
  for (const e of events) { if (e.kind === "launch") launched[e.detail.split(" ")[0]] = e.ts; lastBy[e.agent] = e; }
  const stopped = control.run === "stop" || !!control.finished;
  const meterAt = {}; for (const m of R.meter_log) if (m.ts <= t) meterAt[m.agent] = m;
  const ckAt = {}; for (const c of R.all_checkpoints) if (c.ts <= t) ckAt[c.agent] = c;
  const msgs = R.all_messages.filter(m => m.sent <= t);
  if (!Object.keys(launched).length) for (const w of R.workers) launched[w.name] = +R.control.started || t;  /* older runs */
  const workers = R.workers.filter(w => launched[w.name] !== undefined && launched[w.name] <= t).map(w => {
    const le = lastBy[w.name], age = le ? t - le.ts : t - launched[w.name], mt = meterAt[w.name] || {};
    const working = le && age < 25 && ["tool", "claim"].includes(le.kind);
    const owned = Object.values(tasks).find(x => x.status === "claimed" && x.owner === w.name);
    return {...w, status: stopped ? "stopped" : "busy", hb_age: Math.round(age),
      note: stopped ? "stopped by conductor" : !le ? "starting" : working ? `working: ${le.kind === "tool" ? le.detail.split(" ")[0] : "claim_task"}` : "parked: waiting for inbox",
      task: owned ? owned.title : "", checkpoint: (ckAt[w.name] || {}).summary || "", context_pct: mt.context_pct ?? null, cost_usd: mt.cost_usd ?? null,
      unread: msgs.filter(m => m.recipient === w.name && (m.read == null || m.read > t)).length};
  });
  const fives = Object.values(meterAt).map(m => m.five_pct).filter(v => v != null);
  return {...R, now: t, control, workers, tasks: Object.values(tasks).sort((a, z) => a.id - z.id), merges,
    meter: {...R.meter, five: fives.length ? Math.max(...fives) : null},
    messages: msgs.slice(-80), events: events.slice(-200), conductor: {note: "replay", age: 0},
    integrated: R.integrated && R.integrated.ts <= t ? R.integrated : null, report: control.finished ? R.report : null};
}
function replayRender() {
  const st = snapshot(R, rt);
  last = st; fetchedAt = Date.now(); serverSkew = Date.now() / 1000 - rt;
  render(st);
  $("r-pos").value = rt; $("r-t").textContent = `${hhmm(rt)} · +${dur(rt - rt0)} / ${dur(rt1 - rt0)}`;
}
async function startReplay() {
  document.body.classList.add("replay-on");
  try { const r = await fetch(`${API}/replay`); if (!r.ok) throw new Error(`hub answered ${r.status}`); R = await r.json(); }
  catch (e) { $("attn").innerHTML = `<div class="it bad"><div class="tx"><div class="t">Replay could not load</div><div class="d">${esc(e.message)}</div></div></div>`; $("attn").classList.add("show"); return; }
  rt0 = +R.control.started || (R.all_events[0] || {}).ts || R.now;
  rt1 = +R.control.finished || (R.all_events[R.all_events.length - 1] || {}).ts || R.now;
  const at = +new URLSearchParams(location.search).get("at");  /* ?at=0.5 opens the replay halfway through */
  rt = at > 0 && at <= 1 ? rt0 + at * (rt1 - rt0) : rt0; $("r-pos").min = rt0; $("r-pos").max = rt1; $("r-pos").step = .25;
  replayRender();
  $("r-play").onclick = () => { if (rt >= rt1) rt = rt0; rplay = !rplay; $("r-play").textContent = rplay ? "Pause" : "Play"; };
  $("r-speed").onchange = e => rspeed = +e.target.value;
  $("r-pos").oninput = e => { rt = +e.target.value; replayRender(); };
  setInterval(() => { if (!rplay) return; rt = Math.min(rt1, rt + .25 * rspeed); if (rt >= rt1) { rplay = false; $("r-play").textContent = "Play"; } replayRender(); }, 250);
}
if (VIEWS.includes(location.hash.slice(1))) setView(location.hash.slice(1));
if (REPLAY) startReplay(); else { tick(); setInterval(tick, 1200); } setInterval(clocks, 1000); requestAnimationFrame(frame);
addEventListener("resize", () => { if (last) { $("view").innerHTML = ""; setHTML($("pane"), ""); tokPos = {}; drawView(last); } });
</script>
</body>
</html>
