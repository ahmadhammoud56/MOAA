<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Plex Sans"; src: url(/fonts/IBMPlexSans-Variable.woff2) format("woff2"); font-weight: 100 700; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/IBMPlexMono-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 500; }
:root {
  --bg: #0b0d10; --panel: #121519; --raise: #171b20; --sunk: #0e1013; --line: #232830; --line-strong: #343b45;
  --text: #d7dce2; --dim: #8a939e; --faint: #5c6570; --accent: #c8a24a; --accent-soft: rgba(200,162,74,.14);
  --danger: #c4544a; --ok: #6f9e7a; --info: #5f86b0;
  --haiku: #6f9e7a; --sonnet: #5f86b0; --opus: #b08a4f; --fable: #8c78b0;
  --sans: "Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "Plex Mono", Consolas, monospace;
  --danger-ink: #f0d6d3; --danger-bg: #2a1715; --danger-bg2: #241413; --ok-ink: #b9d8c0; --ok-bg: #13201a;
  --info-ink: #a9c3de; --accent-ink: #f0e2bc; --accent-bg: #2a2414; --hz1: #1d1a12; --hz2: #15130e; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0f3; --panel: #f8f9fa; --raise: #ffffff; --sunk: #e4e7eb; --line: #d5dae0; --line-strong: #b4bcc6;
  --text: #14181d; --dim: #4d5661; --faint: #77818c; --accent: #8f6a12; --accent-soft: rgba(143,106,18,.12);
  --danger: #b03d33; --ok: #3a7549; --info: #3a6796;
  --haiku: #4a8a5a; --sonnet: #3f6fa3; --opus: #96703a; --fable: #6f5a9f;
  --danger-ink: #8a2b23; --danger-bg: #f6e3e1; --danger-bg2: #f0d4d0; --ok-ink: #2f6a3e; --ok-bg: #e2efe5;
  --info-ink: #2f5a87; --accent-ink: #5e4508; --accent-bg: #f3ead3; --hz1: #efe4c4; --hz2: #e5d6ab; color-scheme: light;
}
@media (prefers-color-scheme: light) { :root[data-theme="system"] {
  --bg: #eef0f3; --panel: #f8f9fa; --raise: #ffffff; --sunk: #e4e7eb; --line: #d5dae0; --line-strong: #b4bcc6;
  --text: #14181d; --dim: #4d5661; --faint: #77818c; --accent: #8f6a12; --accent-soft: rgba(143,106,18,.12);
  --danger: #b03d33; --ok: #3a7549; --info: #3a6796;
  --haiku: #4a8a5a; --sonnet: #3f6fa3; --opus: #96703a; --fable: #6f5a9f;
  --danger-ink: #8a2b23; --danger-bg: #f6e3e1; --danger-bg2: #f0d4d0; --ok-ink: #2f6a3e; --ok-bg: #e2efe5;
  --info-ink: #2f5a87; --accent-ink: #5e4508; --accent-bg: #f3ead3; --hz1: #efe4c4; --hz2: #e5d6ab; color-scheme: light;
} }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line-strong); }
::-webkit-scrollbar-track { background: transparent; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- header ---------- */
header { display: grid; grid-template-columns: auto auto auto 1fr auto auto; gap: 18px; align-items: center; height: 52px;
  padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; }
header::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 120px; background: var(--accent);
  opacity: .6; animation: sweep 7s linear infinite; }
@keyframes sweep { from { transform: translateX(-120px); } to { transform: translateX(100vw); } }
a.home { font: 500 11px var(--mono); color: var(--dim); text-decoration: none; border: 1px solid var(--line-strong); padding: 6px 9px; letter-spacing: .08em; }
a.home:hover { color: var(--text); border-color: var(--dim); }
.brand { font: 500 12px var(--mono); letter-spacing: .2em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .mark { width: 14px; height: 14px; border: 1px solid var(--accent); position: relative; }
.brand .mark::after { content: ""; position: absolute; inset: 3px; background: var(--accent); animation: blink 2s steps(1) infinite; }
.brand .run { color: var(--faint); letter-spacing: .04em; }
.pulse { display: flex; gap: 14px; font: 11px var(--mono); color: var(--dim); white-space: nowrap; }
.pulse b { color: var(--text); font-weight: 500; }
.goal { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.meters { display: flex; gap: 14px; }
.meter { width: 120px; font: 11px var(--mono); color: var(--dim); }
.meter .row { display: flex; justify-content: space-between; }
.meter .bar { position: relative; height: 5px; background: var(--sunk); border: 1px solid var(--line); margin-top: 4px; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--dim); transition: width .8s cubic-bezier(.2,.7,.2,1), background .4s; }
.meter .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--faint); }
.meter .tick.stop { background: var(--danger); }
.controls { display: flex; gap: 8px; }
button { white-space: nowrap; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text);
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: 2px; padding: 7px 11px; cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s; }
button:hover:not(:disabled) { border-color: var(--dim); } button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.danger { color: var(--danger-ink); border-color: var(--danger); background: var(--danger-bg); }
button.go { color: var(--ok-ink); border-color: var(--ok); background: var(--ok-bg); }
button:focus-visible, a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#integrate, #resume { display: none; } #integrate.show, #resume.show { display: inline-block; }

.banner { display: none; height: 30px; align-items: center; padding: 0 16px; font: 500 11px var(--mono); letter-spacing: .1em;
  border-bottom: 1px solid var(--danger); color: var(--danger-ink); background: repeating-linear-gradient(-45deg, var(--danger-bg) 0 12px, var(--danger-bg2) 12px 24px);
  background-size: 34px 34px; animation: hazard 1.2s linear infinite; }
@keyframes hazard { to { background-position: 34px 0; } }
.banner.show { display: flex; }
.banner.ok { border-bottom-color: var(--ok); color: var(--ok-ink); background: var(--ok-bg); animation: none; }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 390px; height: calc(100% - 52px); }
body.banner-on main { height: calc(100% - 82px); }
section { border-right: 1px solid var(--line); overflow: auto; min-height: 0; position: relative; }
section:last-child { border-right: 0; }
h2 { margin: 0; padding: 0 14px; height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font: 500 11px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
h2 span { color: var(--faint); letter-spacing: .04em; text-transform: none; }
.tabs { display: flex; gap: 0; }
.tabs button { padding: 4px 10px; font-size: 10px; border-radius: 0; background: transparent; }
.tabs button.on { border-color: var(--accent); color: var(--accent); }
.center { display: grid; grid-template-rows: minmax(0, 1fr) 176px; overflow: hidden; }
.center > div { position: relative; overflow: hidden; min-height: 0; border-bottom: 1px solid var(--line); }
.center > div.tl { overflow: auto; }
.right { display: grid; grid-template-rows: minmax(180px, 1fr) minmax(0, auto) minmax(140px, .8fr); overflow: hidden; }
.right > div { overflow: auto; min-height: 0; border-bottom: 1px solid var(--line); }
.right > div.mq { max-height: 46vh; }

/* ---------- workers ---------- */
.worker { padding: 11px 14px 12px; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; position: relative;
  transition: border-color .3s, background .3s; }
.worker.busy { border-left-color: var(--accent); background: var(--accent-soft); }
.worker.boot { animation: reveal .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.worker.boot::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); animation: scan 1.1s ease-out forwards; }
@keyframes scan { from { left: 0; opacity: 1; } to { left: 100%; opacity: 0; } }
.worker .top { display: flex; align-items: center; gap: 8px; }
.led { width: 8px; height: 8px; flex: none; background: var(--faint); }
.led.busy { background: var(--accent); animation: blink 1s steps(2, jump-none) infinite; }
.led.parked { background: var(--accent); opacity: .55; }
.led.booting { background: var(--info); animation: blink .25s steps(2, jump-none) infinite; }
.led.stopped { background: transparent; border: 1px solid var(--danger); }
.worker .name { font: 500 13px var(--mono); }
.worker .role { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.worker .status { margin-left: auto; font: 11px var(--mono); color: var(--dim); text-transform: uppercase; }
.worker.busy .status { color: var(--accent); }
.worker .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font: 11px var(--mono); color: var(--faint); }
.swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: 0; }
.bootseq { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 8px; }
.bootseq i { font: normal 500 9px var(--mono); letter-spacing: .06em; color: var(--faint); border-top: 2px solid var(--line-strong); padding-top: 3px; transition: color .25s, border-color .25s; }
.bootseq i.done { color: var(--dim); border-top-color: var(--ok); }
.bootseq i.cur { color: var(--accent); border-top-color: var(--accent); animation: blink .6s steps(2, jump-none) infinite; }
.ctx { height: 2px; background: var(--sunk); margin-top: 7px; position: relative; }
.ctx i { position: absolute; inset: 0 auto 0 0; background: var(--line-strong); transition: width .8s; }
.spark { display: block; width: 100%; height: 22px; margin-top: 6px; }
.spark polyline { fill: none; stroke: var(--dim); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark .area { fill: var(--accent-soft); stroke: none; }
.worker .line { margin-top: 6px; font-size: 12px; color: var(--dim); }
.worker .line b { color: var(--text); font-weight: 500; }
.typing::after { content: "_"; animation: blink 1s steps(1) infinite; color: var(--accent); margin-left: 2px; }

/* ---------- flow + topology ---------- */
svg { display: block; width: 100%; }
#view { height: calc(100% - 34px); }
.st-box { fill: var(--sunk); stroke: var(--line); }
.st-box.hot { stroke: var(--line-strong); }
.st-name { fill: var(--dim); font: 500 10px var(--mono); letter-spacing: .14em; }
.st-count { fill: var(--text); font: 500 18px var(--mono); }
.st-sub { fill: var(--faint); font: 10px var(--mono); }
.belt { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
.belt.run { animation: belt 1.1s linear infinite; stroke: var(--line-strong); }
@keyframes belt { to { stroke-dashoffset: -12; } }
.belt-arrow { fill: var(--line-strong); }
.tok { transition: transform .95s cubic-bezier(.65,0,.2,1), opacity .5s; }
.tok rect.body { fill: var(--panel); stroke: var(--line-strong); }
.tok text { fill: var(--text); font: 11px var(--mono); }
.tok text.sub { fill: var(--faint); font: 9.5px var(--mono); }
.tok.enter { opacity: 0; }
.trail { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; animation: trail 1.6s ease-out forwards; }
@keyframes trail { from { opacity: .95; } to { opacity: 0; } }
.chipw rect { fill: var(--raise); stroke: var(--line); }
.chipw text { fill: var(--dim); font: 10px var(--mono); }
.chipw.boot { animation: chipin .6s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes chipin { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
.node rect.box { fill: var(--panel); stroke: var(--line-strong); transition: stroke .3s; }
.node.busy rect.box { stroke: var(--accent); stroke-dasharray: 6 4; animation: march 1s linear infinite; }
.node.boot rect.box { stroke: var(--info); stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw 1.2s ease-out forwards; }
.node.boot text { opacity: 0; animation: fadein .4s .8s forwards; }
.deploy { stroke: var(--info); fill: none; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s ease-out forwards, trail 2.6s 1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes march { to { stroke-dashoffset: -20; } }
.node text { fill: var(--text); font: 500 12px var(--mono); }
.node text.sub { fill: var(--faint); font: 10px var(--mono); }
.edge { stroke: var(--line-strong); fill: none; transition: stroke .4s; }
.edge.hot { stroke: var(--accent); stroke-width: 1.2; }
.edgelabel { fill: var(--faint); font: 10px var(--mono); }
.packet { fill: var(--accent); }
.legend i { font-style: normal; }

/* ---------- timeline ---------- */
#lanes text { fill: var(--dim); font: 11px var(--mono); }
#lanes line.lane { stroke: var(--line); }
#lanes line.now { stroke: var(--accent); stroke-dasharray: 2 3; }
#lanes text.scale { fill: var(--faint); font: 10px var(--mono); }

/* ---------- pipeline ---------- */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); min-height: 100%; }
.col { background: var(--bg); min-height: 100%; padding: 6px 4px 10px; min-width: 0; }
.col .head { display: flex; justify-content: space-between; font: 500 10px var(--mono); letter-spacing: .06em; color: var(--faint);
  padding: 2px 3px 7px; text-transform: uppercase; }
.col .head b { color: var(--dim); font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--line-strong); padding: 6px 7px; margin-bottom: 5px;
  font-size: 11.5px; line-height: 1.35; will-change: transform; position: relative; }
.card .id { font: 10px var(--mono); color: var(--faint); display: flex; justify-content: space-between; gap: 4px; }
.card .t { margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.card.review { border-left-color: var(--info); } .card.claimed { border-left-color: var(--accent); }
.card.approved { border-left-color: var(--ok); } .card.merged { border-left-color: var(--ok); opacity: .75; }
.card.blocked { border-left-color: var(--danger); border-color: rgba(196,84,74,.5); }
.score { font: 500 10px var(--mono); border: 1px solid var(--line-strong); padding: 0 3px; color: var(--text); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: rgba(200,162,74,.28); } to { background: var(--panel); } }

/* ---------- review gates ---------- */
.gate { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.gate.new { animation: slidein .35s ease-out both; }
.gate .what { font-size: 12px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.gate .what b { font: 500 11px var(--mono); color: var(--faint); margin-right: 6px; }
.gate .verdict { font: 500 10px var(--mono); letter-spacing: .1em; padding: 1px 6px; border: 1px solid var(--line-strong); align-self: center; }
.gate .verdict.pass { color: var(--ok-ink); border-color: var(--ok); } .gate .verdict.fail { color: var(--danger-ink); border-color: var(--danger); }
.gate .verdict.wait { color: var(--info-ink); border-color: var(--info); animation: blink 1.4s steps(2, jump-none) infinite; }
.gate .bar { grid-column: 1 / -1; position: relative; height: 6px; background: var(--sunk); border: 1px solid var(--line); margin-top: 4px; }
.gate .bar i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
.gate .bar u { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--text); text-decoration: none; }
.gate .who { grid-column: 1 / -1; font: 10.5px var(--mono); color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.gate .notes { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ---------- merge strip + feed ---------- */
.merge { padding: 9px 14px; font: 11px var(--mono); color: var(--dim); display: grid; gap: 6px; }
.merge .branch { color: var(--text); }
.chain { display: flex; gap: 3px; flex-wrap: wrap; }
.chain i { width: 10px; height: 10px; background: var(--ok); display: inline-block; }
.chain i.new { animation: chipin .4s both; }
.chain i.queued { background: transparent; border: 1px solid var(--accent); animation: blink 1.4s steps(2, jump-none) infinite; }
.chain i.conflict { background: var(--danger); }
.report { margin: 0; padding: 8px 14px 12px; font: 11px/1.5 var(--mono); color: var(--dim); white-space: pre-wrap; }
.log div { padding: 4px 12px; border-bottom: 1px solid var(--line); font: 11px/1.5 var(--mono); color: var(--dim); }
.log div b { color: var(--text); font-weight: 500; }
.log div.new { animation: slidein .35s ease-out; }
@keyframes slidein { from { transform: translateX(-8px); opacity: 0; background: var(--accent-soft); } to { transform: none; opacity: 1; } }
.k-verdict b, .k-merge b, .k-finish b { color: var(--ok); } .k-stop b, .k-guard b, .k-merge-conflict b { color: var(--danger); }
.k-launch b { color: var(--info-ink); }
.empty { padding: 14px; color: var(--faint); font-size: 12px; }

/* ---------- html panes (tree, cost) ---------- */
#pane { height: calc(100% - 34px); overflow: auto; display: none; container-type: inline-size; }
.center.html-view #pane { display: block; } .center.html-view #view { display: none; }
.worker[data-worker] { cursor: pointer; } .worker[data-worker]:hover { background: var(--raise); }
.worker[data-worker]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tag-demo { font: 500 10px var(--mono); letter-spacing: .12em; color: var(--info-ink); border: 1px solid var(--info); padding: 1px 6px; display: none; }
.tag-demo.show { display: inline-block; }

/* ---------- TREE: the run as a terminal-style agent tree (brighter, terminal palette) ---------- */
.tree { --bg: #0b0d10; --panel: #121519; --raise: #171b20; --sunk: #0e1013; --line: #232830; --line-strong: #343b45;
  --text: #d7dce2; --dim: #8a939e; --faint: #5c6570; background: #0b0d10; min-height: 100%; }  /* a terminal pane stays dark in the light theme */

.tree { --tg: #57d68d; --to: #f0a14a; --tw: #c9ced6; --tv: #a98bf0; --ta: #e8b84a; --tb: #6cb2f0; --tr: #ef6a5a; --td: #6b7480;
  font: 11.5px/1.5 var(--mono); color: #c3c9d1; padding: 10px 12px 12px; min-width: 0; }
.tree .t-g { color: var(--tg); } .tree .t-o { color: var(--to); } .tree .t-w { color: var(--tw); } .tree .t-v { color: var(--tv); }
.tree .t-a { color: var(--ta); } .tree .t-b { color: var(--tb); } .tree .t-r { color: var(--tr); } .tree .t-d { color: var(--td); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; margin-bottom: 12px; font-size: 10.5px; letter-spacing: .06em; }
.step { padding: 3px 9px; border: 1px solid transparent; color: var(--td); white-space: nowrap; }
.step.ok { color: var(--tg); } .step.on { color: #e9edf2; border-color: var(--tw); background: #171b20; }
.step.on::before { content: "▸ "; color: var(--ta); }
.steps .sep { color: #343b45; }
.tbody { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 18px; position: relative; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: #4a525d; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0 7; }
.wire.run { animation: wire 1.4s linear infinite; }
@keyframes wire { to { stroke-dashoffset: -14; } }
.tbox { border: 1px dashed var(--td); padding: 8px 10px; background: var(--bg); position: relative; z-index: 1; min-width: 0; }
.tbox .ttl { color: #e9edf2; font-weight: 500; text-align: center; }
.tbox .c { text-align: center; }
.tbox.hot { border-style: solid; }
.rail { border-color: var(--tw); align-self: start; }
.rail .rv { margin-bottom: 8px; } .rail .rv b { font-weight: 500; }
.rail .gl { margin-top: 2px; padding: 3px 5px; border: 1px solid transparent; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rail .gl.hot { border-color: var(--tw); background: #171b20; color: #e9edf2; }
.rail .gl.hot::before { content: "◆ "; color: var(--ta); }
.rail .gs { padding: 0 5px 3px; color: var(--td); font-size: 10.5px; }
.rail .foot { margin-top: 10px; color: var(--td); font-size: 10.5px; }
.tmain { display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0; }
.tmain > .tbox { width: min(100%, 420px); }
.tmain > .tbox.wide { width: min(100%, 560px); }

<script>
const TOKEN = "__TOKEN__", RUN = "__RUN__", API = `/api/run/${RUN}`;

async function post(action, confirmText, body = {}) {

  const r = await fetch(`${API}/${action}`, {method: "POST", headers: {"X-War-Room-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const out = await r.json().catch(() => ({}));

/* ---------- boot detection: a worker seen for the first time, or launched seconds ago ---------- */

  for (const w of st.workers) {

    prevSession[w.name] = w.session;

const BOOT = ["SPAWN", "PROFILE", "PLUGINS", "BUS", "READY"];
function bootStage(w) {

  stop: "var(--danger)", guard: "var(--danger)", review: "var(--info)", verdict: "var(--ok)", merge: "var(--ok)", "merge-conflict": "var(--danger)", finish: "var(--ok)"};

  names.forEach((n, i) => { const y = 26 + i * lh; out += `<text x="10" y="${y + 4}">${esc(n)}</text><line class="lane" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>`; });

      task: owned ? owned.title : "", checkpoint: (ckAt[w.name] || {}).summary || "", context_pct: mt.context_pct ?? null, cost_usd: mt.cost_usd ?? null,

  });

  return {...R, now: t, control, workers, tasks: Object.values(tasks).sort((a, z) => a.id - z.id), merges,
    meter: {...R.meter, five: fives.length ? Math.max(...fives) : null},
    messages: msgs.slice(-80), events: events.slice(-200), conductor: {note: "replay", age: 0},

}
function replayRender() {

  $("r-pos").value = rt; $("r-t").textContent = `${hhmm(rt)} · +${dur(rt - rt0)} / ${dur(rt1 - rt0)}`;
}
async function startReplay() {
  document.body.classList.add("replay-on");
  try { const r = await fetch(`${API}/replay`); if (!r.ok) throw new Error(`hub answered ${r.status}`); R = await r.json(); }
  catch (e) { const b = $("banner"); b.textContent = `REPLAY COULD NOT LOAD (${e.message})`; b.className = "banner show"; return; }
  rt0 = +R.control.started || (R.all_events[0] || {}).ts || R.now;
  rt1 = +R.control.finished || (R.all_events[R.all_events.length - 1] || {}).ts || R.now;
  const at = +new URLSearchParams(location.search).get("at");  /* ?at=0.5 opens the replay halfway through */
  rt = at > 0 && at <= 1 ? rt0 + at * (rt1 - rt0) : rt0; $("r-pos").min = rt0; $("r-pos").max = rt1; $("r-pos").step = .25;
  replayRender();
  $("r-play").onclick = () => { if (rt >= rt1) rt = rt0; rplay = !rplay; $("r-play").textContent = rplay ? "Pause" : "Play"; };
  $("r-speed").onchange = e => rspeed = +e.target.value;
  $("r-pos").oninput = e => { rt = +e.target.value; replayRender(); };
  setInterval(() => { if (!rplay) return; rt = Math.min(rt1, rt + .25 * rspeed); if (rt >= rt1) { rplay = false; $("r-play").textContent = "Play"; } replayRender(); }, 250);
}
if (VIEWS.includes(location.hash.slice(1))) setView(location.hash.slice(1));
if (REPLAY) startReplay(); else { tick(); setInterval(tick, 1200); } setInterval(clocks, 1000); requestAnimationFrame(frame);
addEventListener("resize", () => { if (last) { $("view").innerHTML = ""; setHTML($("pane"), ""); tokPos = {}; drawView(last); } });
</script>
