<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Room · History</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui.css">
<style>
.top { position: sticky; top: 0; z-index: 5; }
.wrap { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 0; flex: 1; min-height: 0; }
.list-col { border-right: 1px solid var(--line); padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 10px; }
.filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.list { display: grid; gap: 8px; }
.item { padding: 11px 13px; cursor: pointer; border-left: 3px solid var(--line-strong); animation: rise .35s cubic-bezier(.2,.7,.2,1) both; }
.item:hover { border-color: var(--line-strong); background: var(--raise); }
.item.finished { border-left-color: var(--ok); } .item.stopped { border-left-color: var(--danger); }
.item.on { border-color: var(--accent); border-left-color: var(--accent); background: var(--raise); }
.item .r1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.item .name { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .when { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; }
.item .goal { font-size: 13.5px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 12px; color: var(--faint); margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.dots { display: inline-flex; gap: 3px; }
.dots .sw { margin: 0; }
.detail { padding: 22px 28px 40px; min-width: 0; max-width: 1040px; }
.dname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dname h2 { font: 600 19px var(--sans); margin: 0 6px 0 0; }
.drun { font: 12.5px var(--mono); color: var(--dim); margin-top: 4px; }
.dgoal { font-size: 14.5px; margin-top: 10px; }
.team { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.member { display: flex; align-items: center; gap: 9px; padding: 7px 11px 7px 8px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); min-width: 0; }
.member b { font-weight: 600; font-size: 13px; }
.member > div > span:last-child { display: block; font-size: 12px; color: var(--dim); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.tiles div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); padding: 11px 13px; font-size: 12.5px; color: var(--dim); min-width: 0; }
.tiles b { display: block; color: var(--text); font: 500 19px var(--mono); margin: 2px 0; }
.tiles small { display: block; font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub2 { font: 600 14px var(--sans); margin: 24px 0 8px; }
pre.report { margin: 0; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); font: 12px/1.65 var(--mono); color: var(--dim); white-space: pre-wrap; }
@media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } .list-col { border-right: 0; border-bottom: 1px solid var(--line); } .tiles { grid-template-columns: repeat(2, 1fr); } .detail { padding: 18px 16px 30px; } }
</style>
</head>
<body>
<div class="app">
<nav class="side" id="side"></nav>
<div class="page">
  <header class="top">
    <div class="ttl"><h1>History</h1><div class="sub" id="sub">Finished and stopped runs: reports, cost, replays</div></div>
    <button type="button" class="cmdk" onclick="palette.open()"><span>Search or run a command…</span><span class="kbd">Ctrl K</span></button>
  </header>
  <div class="wrap">
    <div class="list-col">
      <div class="filters"><input type="text" id="q" placeholder="Filter by name or goal" aria-label="Filter runs" spellcheck="false">
        <select id="f" aria-label="Show"><option value="">All runs</option><option value="finished">Finished</option><option value="stopped">Stopped</option><option value="real">Real only</option><option value="demo">Demos</option></select></div>
      <div class="list" id="list"></div>
    </div>
    <div class="detail" id="detail" aria-live="polite"></div>
  </div>
</div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"></div></div>
<script src="/ui.js"></script>
<script>
const TOKEN = "__TOKEN__";
const day = t => t ? new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}) : "--";
let runs = [], pick = new URLSearchParams(location.search).get("run");
shell("history");
api("/api/home").then(h => { const live = h.runs.find(r => r.status === "live"); setRunNav((live || h.runs.find(r => r.status !== "planned"))?.run, !!live); }).catch(() => {});

const shown = () => { const q = $("q").value.toLowerCase().trim(), f = $("f").value;
  return runs.filter(r => (!q || `${r.run} ${r.goal}`.toLowerCase().includes(q)) && (!f || (f === "demo" ? r.demo : f === "real" ? !r.demo : r.status === f))); };
function item(r) {
  const fams = [...new Set((r.workers || []).map(w => family(w.model)))];
  return `<div class="panel item ${esc(r.status)} ${r.run === pick ? "on" : ""}" data-run="${esc(r.run)}" role="button" tabindex="0" aria-current="${r.run === pick}">
    <div class="r1"><span class="tag ${esc(r.status)}">${esc(cap(r.status))}</span>${r.demo ? '<span class="tag demo">Demo</span>' : ""}<span class="name">${esc(r.run)}</span><span class="when">${day(r.started)}</span></div>
    <div class="goal">${esc(r.goal)}</div>
    <div class="meta"><span class="dots">${(r.workers || []).map(w => `<i class="sw f-${family(w.model)}" title="${esc(w.name)} · ${esc(modelName(w.model))}"></i>`).join("")}</span>
      <span>${r.finished_tasks}/${r.tasks} tasks</span><span>${r.passed}/${r.reviews} reviews passed</span>
      <span>${r.tokens ? `${(r.tokens.total / 1e6).toFixed(2)}M tokens` : r.demo ? "simulated" : "not measured"}</span>${fams.filter(f => f !== "claude").map(f => `<span class="fam f-${f}">${esc(FAMILIES[f])}</span>`).join("")}</div></div>`;
}
function detail(r) {
  if (!r) return `<div class="empty">${runs.length ? "Pick a run on the left." : "No finished runs yet. A run lands here when it finishes or is stopped. Start a demo from Home to see one."}</div>`;
  const length = r.finished && r.started ? r.finished - r.started : null, allies = (r.workers || []).filter(w => isAlly(w.model)).length;
  return `<div class="dname"><h2>${esc(r.goal || r.run)}</h2><span class="tag ${esc(r.status)}">${esc(cap(r.status))}</span>${r.demo ? '<span class="tag demo">Demo</span>' : ""}${r.integrated ? '<span class="tag ok">Integrated</span>' : ""}</div>
    <div class="drun">${esc(r.run)}</div>
    <div class="team">${(r.workers || []).map(w => `<div class="member">${avatar(w.name, w.model)}<div><b>${esc(w.name)}</b> ${famBadge(w.model)}<span>${esc(w.role)}${isAlly(w.model) ? "" : ` · ${esc(modelName(w.model))} · ${esc(w.effort)}`}</span></div></div>`).join("")}</div>
    <div class="tiles"><div>Length<b>${dur(length)}</b><small>${day(r.started)} → ${day(r.finished)}</small></div>
      <div>Tasks<b>${r.finished_tasks}/${r.tasks}</b><small>${r.merged} merged${r.integrated ? " · integrated" : ""}</small></div>
      <div>Reviews<b>${r.passed}/${r.reviews}</b><small>verdicts that passed</small></div>
      <div>Tokens<b>${r.tokens ? `${(r.tokens.total / 1e6).toFixed(2)}M` : "--"}</b><small>${r.tokens ? `${r.tokens.api_calls} calls · ${Math.round(r.tokens.per_worker_task / 1000)}k / worker-task` : r.demo ? "demo: simulated" : "not measured"}${r.cost_usd != null ? ` · ${money(r.cost_usd)} statusline` : ""}${allies ? ` · ${allies} ${allies === 1 ? "ally" : "allies"} on their own limits` : ""}</small></div></div>
    <div class="acts"><button class="primary" type="button" id="replay">Replay</button><button type="button" id="open">Open run view</button><button class="danger" type="button" id="del">Delete run</button><span class="msg" id="msg"></span></div>
    <div class="sub2">Report</div>${r.report ? `<pre class="report">${esc(r.report)}</pre>` : `<div class="empty">No report: the run was stopped before it finished.</div>`}`;
}
function render() {
  const list = shown(), sel = runs.find(r => r.run === pick) || null;
  setHTML($("list"), list.map(item).join("") || `<div class="empty">${runs.length ? "No run matches the filter." : "Nothing here yet. Start a demo from Home to see how a run plays out."}</div>`);
  const d = detail(sel);
  if ($("detail")._h !== d) { $("detail").innerHTML = d; $("detail")._h = d; wire(sel); }
  const real = runs.filter(r => !r.demo);
  $("sub").textContent = runs.length ? `${plural(real.length, "run")}${runs.length > real.length ? ` + ${runs.length - real.length} demo` : ""} · ${(real.reduce((a, r) => a + (r.tokens ? r.tokens.total : 0), 0) / 1e6).toFixed(1)}M tokens measured · ${money(real.reduce((a, r) => a + (r.cost_usd || 0), 0))} statusline spend`
    : "Finished and stopped runs: reports, cost, replays";
}
function wire(r) {
  if (!r) return;
  $("open").onclick = () => location.href = `/run/${encodeURIComponent(r.run)}`;
  $("replay").onclick = () => location.href = `/run/${encodeURIComponent(r.run)}?replay=1`;
  $("del").onclick = async () => {
    if (!confirm(`Delete ${r.run}? Its board, log and report are removed. ${r.demo ? "" : "Its measured cost stays in the cost model."}`)) return;
    try { await api(`/api/run/${encodeURIComponent(r.run)}/discard`, {}); } catch (e) { $("msg").className = "msg err"; $("msg").textContent = e.message; return; }
    pick = null; history.replaceState(null, "", "/history"); load();
  };
}
function choose(run) { pick = run; history.replaceState(null, "", `/history?run=${encodeURIComponent(run)}`); render(); }
$("list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it) choose(it.dataset.run); });
$("list").addEventListener("keydown", e => {
  const it = e.target.closest(".item"); if (!it) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(it.dataset.run); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); (e.key === "ArrowDown" ? it.nextElementSibling : it.previousElementSibling)?.focus(); }
});
$("q").oninput = render; $("f").onchange = render;
palette.add(() => runs.flatMap(r => [{label: `Replay ${r.run}`, hint: r.goal, group: "History", run: () => location.href = `/run/${encodeURIComponent(r.run)}?replay=1`},
  {label: `Show ${r.run}`, hint: `${r.status}${r.demo ? " · demo" : ""}`, group: "History", run: () => choose(r.run)}]));
async function load() {
  try { runs = (await api("/api/history")).runs; }
  catch (e) { $("list").innerHTML = `<div class="empty">The hub did not answer (${esc(e.message)}).</div>`; return; }
  if (!pick && runs.length) pick = runs[0].run;
  render();
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
